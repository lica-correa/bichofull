name: CI Bichofull

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      - name: Build backend
        run: |
          cd backend
          mvn clean install

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build